<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">VMH-P overview</title>
  <desc id="desc">Frozen host model exports cached evidence packets. VMH-P induces vertical and horizontal structures and refines predictions without updating the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5f70"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15202b" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.4; filter: url(#shadow); }
      .host { fill: #eef5ff; stroke: #497da8; stroke-width: 2; }
      .cache { fill: #f4f0ff; stroke: #8067b7; stroke-width: 2; }
      .vertical { fill: #edf8f2; stroke: #4f9a68; stroke-width: 2; }
      .horizontal { fill: #fff3ed; stroke: #b66b4c; stroke-width: 2; }
      .final { fill: #fff9e9; stroke: #be9132; stroke-width: 2; }
      .small { font: 500 16px Arial, Helvetica, sans-serif; fill: #27313a; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #1d252d; }
      .sub { font: 400 14px Arial, Helvetica, sans-serif; fill: #5d6873; }
      .mono { font: 500 13px Arial, Helvetica, sans-serif; fill: #45505a; }
      .arrow { stroke: #4d5f70; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #789; stroke-width: 1.6; fill: none; }
      .tree-edge { stroke: #4f9a68; stroke-width: 2; fill: none; }
      .pos { fill: #c94f59; }
      .neg { fill: #4577b3; }
      .neu { fill: #f4f6f8; stroke: #c8d0d8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="520"/>
  <rect class="panel" x="28" y="28" width="1124" height="464" rx="18"/>

  <text x="590" y="70" text-anchor="middle" class="label">VMH-P: Plug-and-Play Vertical-Meets-Horizontal Prediction</text>
  <text x="590" y="96" text-anchor="middle" class="sub">Frozen host representations are transformed into explicit prediction-oriented structure.</text>

  <rect class="host" x="68" y="170" width="190" height="112" rx="14"/>
  <text x="163" y="204" text-anchor="middle" class="label">Frozen Host</text>
  <text x="163" y="231" text-anchor="middle" class="small">CLMLF / D2R / SPP-SCL</text>
  <text x="163" y="257" text-anchor="middle" class="sub">no parameter update</text>

  <rect class="cache" x="332" y="170" width="194" height="112" rx="14"/>
  <text x="429" y="203" text-anchor="middle" class="label">Evidence Packet</text>
  <text x="429" y="230" text-anchor="middle" class="small">features + logits + labels</text>
  <text x="429" y="256" text-anchor="middle" class="sub">cached once per split</text>

  <rect class="cache" x="596" y="170" width="190" height="112" rx="14"/>
  <text x="691" y="203" text-anchor="middle" class="label">Evidence Adapter</text>
  <text x="691" y="230" text-anchor="middle" class="small">source alignment</text>
  <text x="691" y="256" text-anchor="middle" class="sub">shared class geometry</text>

  <path class="arrow" d="M258 226 C283 226 304 226 331 226"/>
  <path class="arrow" d="M526 226 C552 226 570 226 595 226"/>

  <rect class="vertical" x="858" y="126" width="224" height="132" rx="14"/>
  <text x="970" y="156" text-anchor="middle" class="label">Vertical Hierarchy</text>
  <text x="970" y="180" text-anchor="middle" class="sub">hyperbolic coarse-to-fine routing</text>
  <circle cx="970" cy="202" r="13" fill="#ffffff" stroke="#4f9a68" stroke-width="2"/>
  <circle cx="930" cy="234" r="11" fill="#ffffff" stroke="#4f9a68" stroke-width="2"/>
  <circle cx="1010" cy="234" r="11" fill="#ffffff" stroke="#4f9a68" stroke-width="2"/>
  <circle cx="905" cy="246" r="7" fill="#ffffff" stroke="#4f9a68" stroke-width="1.6"/>
  <circle cx="955" cy="246" r="7" fill="#ffffff" stroke="#4f9a68" stroke-width="1.6"/>
  <circle cx="990" cy="246" r="7" fill="#ffffff" stroke="#4f9a68" stroke-width="1.6"/>
  <circle cx="1030" cy="246" r="7" fill="#ffffff" stroke="#4f9a68" stroke-width="1.6"/>
  <path class="tree-edge" d="M961 212 L938 226 M979 212 L1002 226 M924 241 L911 245 M936 241 L949 245 M1006 242 L994 245 M1015 241 L1024 245"/>

  <rect class="horizontal" x="858" y="292" width="224" height="132" rx="14"/>
  <text x="970" y="322" text-anchor="middle" class="label">Horizontal Relation Field</text>
  <text x="970" y="346" text-anchor="middle" class="sub">supportive and contrasting links</text>
  <g transform="translate(920,362)">
    <rect class="neu" x="0" y="0" width="24" height="24"/>
    <rect class="pos" x="26" y="0" width="24" height="24" opacity="0.78"/>
    <rect class="neg" x="52" y="0" width="24" height="24" opacity="0.70"/>
    <rect class="neg" x="0" y="26" width="24" height="24" opacity="0.56"/>
    <rect class="neu" x="26" y="26" width="24" height="24"/>
    <rect class="pos" x="52" y="26" width="24" height="24" opacity="0.62"/>
    <rect class="pos" x="0" y="52" width="24" height="24" opacity="0.54"/>
    <rect class="neg" x="26" y="52" width="24" height="24" opacity="0.68"/>
    <rect class="neu" x="52" y="52" width="24" height="24"/>
  </g>
  <text x="970" y="452" text-anchor="middle" class="mono">red: reinforce, blue: suppress</text>

  <path class="arrow" d="M786 212 C814 196 831 190 857 190"/>
  <path class="arrow" d="M786 240 C817 279 832 338 857 358"/>

  <rect class="final" x="424" y="354" width="332" height="84" rx="14"/>
  <text x="590" y="387" text-anchor="middle" class="label">Gated Structured Refinement</text>
  <text x="590" y="414" text-anchor="middle" class="small">host logits + vertical signal + horizontal signal</text>

  <path class="arrow" d="M970 258 C936 326 832 376 757 394"/>
  <path class="arrow" d="M858 372 C825 384 792 391 757 397"/>
  <path class="arrow" d="M429 282 C438 328 471 349 501 354"/>

  <rect class="final" x="80" y="366" width="188" height="58" rx="14"/>
  <text x="174" y="401" text-anchor="middle" class="label">VMH-P Prediction</text>
  <path class="arrow" d="M424 396 C373 396 320 396 269 396"/>

  <text x="590" y="470" text-anchor="middle" class="sub">VMH-P is trained on cached representations only, preserving the original host model as a frozen backbone.</text>
</svg>
